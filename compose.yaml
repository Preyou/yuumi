name: yuumi
services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: yuumi
      POSTGRES_PASSWORD: yuumi
      POSTGRES_DB: yuumi
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-25432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U yuumi -d yuumi]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.10.2
    ports:
      - '127.0.0.1:${REDIS_PORT:-26379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  redis-data:
